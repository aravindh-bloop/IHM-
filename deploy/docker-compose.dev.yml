services:
  api:
    ports:
      # Exposes application port.
    - "8000:8000"
    build:
      context: .
    volumes:
      # Adds current directory as volume.
    - .:/app/src/
    environment:
      # Enables autoreload.
      IHM_BACKEND_RELOAD: "True"

  frontend:
    build:
      context: ./ihm_frontend
      dockerfile: ./Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reload
      - ./ihm_frontend:/app
      # Preserve node_modules
      - /app/node_modules
    environment:
      # Set backend URL for Vite proxy
      VITE_BACKEND_URL: "http://api:8000"
    depends_on:
      - api

  taskiq-worker:
    volumes:
      # Adds current directory as volume.
      - .:/app/src/
    command:
      - taskiq
      - worker
      - ihm_backend.tkq:broker
      - --reload
